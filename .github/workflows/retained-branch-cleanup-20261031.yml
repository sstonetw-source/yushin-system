name: One-time verified retained branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retained-branch-cleanup-20261031.yml']
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: retained-branch-cleanup-20261031
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const manifest = JSON.parse(fs.readFileSync('docs/maintenance/retained-branch-audit-20261031.json','utf8'));
            const allowed = new Set([288,377,385,390]);
            const candidates = manifest.branches.filter(b => b.decision === 'verified-integrated');
            if (candidates.length !== 4 || candidates.some(b => !allowed.has(b.pr))
                || new Set(candidates.map(b => b.pr)).size !== 4) throw Error('Unexpected cleanup manifest');
            let deleted = 0, skipped = 0, failed = 0;
            for (const b of candidates) {
              try {
                const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number:b.pr});
                const open = await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
                const {data: branch} = await github.rest.repos.getBranch({owner,repo,branch:b.branch});
                let valid = b.branch !== 'main' && !branch.protected && branch.commit.sha === b.sha
                  && pr.state === 'closed' && pr.head.sha === b.sha && pr.head.ref === b.branch
                  && pr.head.repo?.full_name === `${owner}/${repo}`
                  && !open.some(p => p.head.ref === b.branch && p.head.repo?.full_name === `${owner}/${repo}`);
                const {data: main} = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
                for (const f of b.files) {
                  if (!f.mainBlobSha) {valid = false; break;}
                  const {data: file} = await github.rest.repos.getContent({owner,repo,path:f.path,ref:main.object.sha});
                  if (Array.isArray(file) || file.sha !== f.mainBlobSha) {valid = false; break;}
                }
                const {data: current} = await github.rest.git.getRef({owner,repo,ref:`heads/${b.branch}`});
                if (!valid || current.object.sha !== b.sha) {
                  skipped++; core.warning(`Skipped changed or unsafe branch: ${b.branch}`); continue;
                }
                await github.rest.git.deleteRef({owner,repo,ref:`heads/${b.branch}`});
                deleted++; core.info(`Deleted verified branch: ${b.branch} at ${b.sha}`);
              } catch (error) {
                failed++; core.error(`${b.branch}: ${error.message}`);
              }
            }
            core.info(`Verified retained cleanup: deleted=${deleted}, skipped=${skipped}, failed=${failed}, held=24`);
            await core.summary.addHeading('Verified retained branch cleanup').addRaw(`deleted=${deleted}, skipped=${skipped}, failed=${failed}, held=24`).write();
            if (failed || skipped) core.setFailed('Cleanup incomplete; inspect log before retry');
