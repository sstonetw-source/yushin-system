name: Regression Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-main
  cancel-in-progress: true

jobs:
  node-regression:
    name: Node regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run pure Node regression tests
        run: node --test tests/phase1.test.js tests/purchasing-workflow.test.js
