name: Regression Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-main
  cancel-in-progress: true

jobs:
  node-regression:
    name: Node regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check core JavaScript syntax
        run: |
          node --check app.js
          node --check modules/supplier-core.js
          node --check modules/inventory-core.js
          node --check modules/receiving-core.js
          node --check modules/fulfillment-core.js
          node --check modules/supply-core.js
          node --check modules/reservation-core.js
          node --check modules/workflow-core.js
          node --check modules/procurement-demand-core.js
          node --check modules/purchasing-analytics-core.js
          node --check modules/trade-analysis-core.js
          node --check functions/purchase-email-core.js
          node --check functions/index.js

      - name: Run pure Node regression tests
        run: node --test tests/trade-analysis.test.js tests/modal-topology.test.js tests/phase1.test.js tests/purchasing-workflow.test.js tests/v2-supplier-core.test.js tests/v2-inventory-core.test.js tests/v2-receiving-core.test.js tests/v2-fulfillment-core.test.js tests/v2-supply-core.test.js tests/v2-reservation-core.test.js tests/v2-workflow-core.test.js tests/v2-procurement-demand-core.test.js tests/v2-purchasing-analytics-core.test.js tests/v2-purchase-email-core.test.js
