name: One-time lineage verified branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-lineage-cleanup-20261031.yml']
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: branch-lineage-cleanup-20261031
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const manifest = JSON.parse(fs.readFileSync('docs/maintenance/branch-lineage-audit-20261031.json','utf8'));
            const expected = {"feat/multi-item-shipment-20261018":"ce2abda57a31a17d8d7d9a90a08aa02f10a280f3","feat/order-amount-details-20261025":"13efc421ff7e95bcb08a895f328b24880e89e038","feat/quick-purchase-preview-backend-gate-20261025":"39f70f0153fe5f6a175c164265d3252fd9fea678","preview/inventory-warehouse-forecast-20260920":"ac5c85618952ad12bc98a9e13ffe7d6f2b035caf","preview/multi-item-order-model-20260920":"37171344b5a67721d1bf9f6de401c1e549534c87","refactor/architecture-unification-20261015":"ebdc997364eafb3bac323b41a239770f24094e2b","refactor/transaction-core-unification-20261015":"6e190ba84cd11c3cb3550b0a258671bc933c4f3f"};
            const candidates = manifest.candidates;
            if (candidates.length !== 7 || new Set(candidates.map(b=>b.branch)).size !== 7
                || candidates.some(b=>expected[b.branch] !== b.sha || b.decision !== 'verified-integrated'))
              throw Error('Unexpected cleanup manifest');
            const {data: main} = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const {data: commit} = await github.rest.git.getCommit({owner,repo,commit_sha:main.object.sha});
            const {data: tree} = await github.rest.git.getTree({owner,repo,tree_sha:commit.tree.sha,recursive:'true'});
            if (tree.truncated) throw Error('Incomplete main tree');
            const mainBlobs = new Map(tree.tree.filter(f=>f.type==='blob').map(f=>[f.path,f.sha]));
            let deleted = 0, skipped = 0, failed = 0;
            for (const b of candidates) {
              try {
                let valid = b.branch !== 'main' && b.files.every(f=>f.mainBlobSha && mainBlobs.get(f.path)===f.mainBlobSha);
                const {data: ancestry} = await github.rest.repos.compareCommits({owner,repo,base:b.integrationCommit,head:main.object.sha});
                valid = valid && ['ahead','identical'].includes(ancestry.status);
                if (b.originalPr) {
                  const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number:b.originalPr});
                  valid = valid && pr.state === 'closed' && pr.head.sha === b.sha
                    && pr.head.ref === b.branch && pr.head.repo?.full_name === `${owner}/${repo}`;
                }
                if (b.integrationPr) {
                  const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number:b.integrationPr});
                  valid = valid && pr.merged === true && pr.merge_commit_sha === b.integrationCommit;
                }
                const open = await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
                const {data: branch} = await github.rest.repos.getBranch({owner,repo,branch:b.branch});
                valid = valid && !branch.protected && branch.commit.sha === b.sha
                  && !open.some(p=>p.head.ref===b.branch && p.head.repo?.full_name===`${owner}/${repo}`);
                const {data: currentMain} = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
                const {data: current} = await github.rest.git.getRef({owner,repo,ref:`heads/${b.branch}`});
                if (!valid || current.object.sha !== b.sha || currentMain.object.sha !== main.object.sha) {
                  skipped++; core.warning(`Skipped changed or unsafe branch: ${b.branch}`); continue;
                }
                await github.rest.git.deleteRef({owner,repo,ref:`heads/${b.branch}`});
                deleted++; core.info(`Deleted lineage-verified branch: ${b.branch} at ${b.sha}`);
              } catch (error) {
                failed++; core.error(`${b.branch}: ${error.message}`);
              }
            }
            core.info(`Lineage cleanup: deleted=${deleted}, skipped=${skipped}, failed=${failed}, held=17`);
            await core.summary.addHeading('Lineage verified branch cleanup').addRaw(`deleted=${deleted}, skipped=${skipped}, failed=${failed}, held=17`).write();
            if (failed || skipped) core.setFailed('Cleanup incomplete; inspect log before retry');
