name: System regression tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'upgrade/**'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check app.js
          node --check modules/fulfillment-core.js
          node --check modules/supply-core.js
          node --check modules/reservation-core.js
          node --check modules/workflow-core.js
      - name: Phase 1 regression tests
        run: node --test tests/phase1.test.js
      - name: Purchasing workflow tests
        if: always()
        run: node --test tests/purchasing-workflow.test.js
      - name: Fulfillment core tests
        if: always()
        run: node --test tests/v2-fulfillment-core.test.js
      - name: Supply core tests
        if: always()
        run: node --test tests/v2-supply-core.test.js
      - name: Reservation core tests
        if: always()
        run: node --test tests/v2-reservation-core.test.js
      - name: Workflow core tests
        if: always()
        run: node --test tests/v2-workflow-core.test.js
      - name: Install Firestore rules test dependencies
        run: npm install --no-save @firebase/rules-unit-testing firebase
      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test Firestore rules
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-yushin "node --test tests/firestore-rules.test.js"
