name: System regression tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'upgrade/**'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check modules/inventory-workspace.js
          node --check app.js
          node --check modules/document-downloads.js
          node --check modules/supplier-core.js
          node --check modules/inventory-core.js
          node --check modules/stock-permissions.js
          node --check modules/receiving-core.js
          node --check modules/fulfillment-core.js
          node --check modules/supply-core.js
          node --check modules/reservation-core.js
          node --check modules/workflow-core.js
          node --check modules/procurement-demand-core.js
          node --check modules/purchasing-analytics-core.js
          node --check modules/trade-analysis-core.js
          node --check functions/purchase-email-core.js
          node --check functions/index.js
      - name: Trade analysis tests
        run: node --test tests/inventory-workspace.test.js tests/inventory-receiving-count.test.js tests/inventory-list-archive.test.js tests/order-role-read.test.js tests/document-downloads.test.js tests/order-cost-reminder.test.js tests/quick-delivery-item.test.js tests/replenishment-entry.test.js tests/order-background.test.js tests/system-audit-shortcuts.test.js tests/receipt-background.test.js tests/trade-analysis.test.js tests/order-purchase-cancellation.test.js
      - name: Phase 1 regression tests
        run: node --test tests/phase1.test.js tests/external-warehouse-dispatch.test.js
      - name: Purchasing workflow tests
        if: always()
        run: node --test --test-reporter=spec tests/purchasing-workflow.test.js tests/firestore-quota-budget.test.js
      - name: Supplier core tests
        if: always()
        run: node --test tests/v2-supplier-core.test.js
      - name: Inventory core tests
        if: always()
        run: node --test tests/v2-inventory-core.test.js
      - name: Receiving core tests
        if: always()
        run: node --test tests/v2-receiving-core.test.js
      - name: Fulfillment core tests
        if: always()
        run: node --test tests/v2-fulfillment-core.test.js
      - name: Supply core tests
        if: always()
        run: node --test tests/v2-supply-core.test.js
      - name: Reservation core tests
        if: always()
        run: node --test tests/v2-reservation-core.test.js
      - name: Workflow core tests
        if: always()
        run: node --test tests/v2-workflow-core.test.js
      - name: Procurement demand core tests
        if: always()
        run: node --test tests/v2-procurement-demand-core.test.js
      - name: Purchasing analytics core tests
        if: always()
        run: node --test tests/v2-purchasing-analytics-core.test.js
      - name: Purchase email core tests
        if: always()
        run: node --test tests/v2-purchase-email-core.test.js
      - name: Prelaunch regression tests
        if: always()
        run: node --test tests/launch-workflow.test.js tests/prelaunch-fixes.test.js tests/auth-startup.test.js tests/backup-upload.test.js
      - name: Install Firestore rules test dependencies
        run: npm install --no-save @firebase/rules-unit-testing firebase
      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test Firestore rules
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-yushin "node --test tests/firestore-rules.test.js"