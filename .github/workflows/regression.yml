name: System regression tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'upgrade/**'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Regression tests
        run: node --test tests/phase1.test.js
      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firestore rules test dependencies
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase
      - name: Validate Firestore rules
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-yushin "node tests/firestore-rules.test.js"
