name: System regression tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'upgrade/**'
permissions:
  contents: read
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated app and module source consistency
        run: |
          node tools/build-app.cjs --check
          node tools/build-functions-core.cjs --check
          find src -name '*.js' -print0 | xargs -0 -n 1 node --check
          find tests -maxdepth 1 \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n 1 node --check
      - name: JavaScript syntax check
        run: |
          node --check modules/order-entry-core.js
          node --check modules/order-entry-ui.js
          node --check modules/order-self-order-required.js
          node --check modules/inventory-workspace.js
          node --check modules/warehouse-logistics.js
          node --check modules/main-warehouse-transfers.js
          node --check modules/delivery-settings.js
          node --check app.js
          node --check modules/customer-cancellations.js
          node --check modules/document-downloads.js
          node --check modules/supplier-core.js
          node --check modules/inventory-core.js
          node --check modules/stock-permissions.js
          node --check modules/free-stock-recovery.js
          node --check modules/receiving-core.js
          node --check modules/fulfillment-core.js
          node --check modules/supply-core.js
          node --check modules/reservation-core.js
          node --check modules/workflow-core.js
          node --check modules/procurement-demand-core.js
          node --check modules/purchasing-analytics-core.js
          node --check modules/trade-analysis-core.js
          node --check functions/purchase-email-core.js
          node --check functions/index.js
      - name: All application regression tests
        run: node --test $(find tests -maxdepth 1 -name '*.test.js' ! -name 'firestore-rules.test.js' | sort)
      - name: Install shared browser and Firestore integration dependencies once
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase firebase-admin@14.2.0 playwright-core@1.56.0 esbuild@0.25.0 html2canvas@1.4.1 jspdf@2.5.2
      - name: Check shared buttons in desktop and mobile Chrome
        run: node tests/ui-control-browser-smoke.js
      - name: Check numeric wheel input and scroll behavior
        run: node tests/number-wheel-browser-smoke.js
      - name: Check per-item service progress in desktop and mobile Chrome
        run: node tests/service-progress-browser-smoke.js
      - name: Check quick-created product brand discovery
        run: node tests/quick-brand-browser-smoke.js
      - name: Check warm sand typography and page alignment
        run: node tests/warm-sand-browser-smoke.js
      - name: Check four workspace improvements in desktop and mobile Chrome
        run: node tests/workspace-four-improvements-browser-smoke.js
      - name: Check unified order and purchasing work-list presentation
        run: node tests/workspace-display-browser-smoke.js
      - name: Check order entry in desktop and mobile Chrome
        run: node tests/order-entry-browser-smoke.js
      - name: Check direct arrival and source retry for five roles in desktop and mobile Chrome
        run: node tests/workflow-audit-browser-smoke.js
      - name: Check free stock recovery in desktop and mobile Chrome
        run: node tests/free-stock-recovery-browser-smoke.js
      - name: Check reconciled product search and margin privacy in desktop and mobile Chrome
        run: node tests/pr-reconciliation-browser-smoke.js
      - name: Check company frequent products and public copy in desktop and mobile Chrome
        run: node tests/frequent-products-browser-smoke.js
      - name: Check authoritative lot display and batch search in desktop and mobile Chrome
        run: node tests/inventory-lot-browser-smoke.js
      - name: Check shared dispatch preparation and cross-page retries in desktop and mobile Chrome
        run: node tests/dispatch-preparation-browser-smoke.js
      - name: Check v2 customer delivery original form in desktop and mobile Chrome
        run: node tests/delivery-confirmation-browser-smoke.js
      - name: Check v2 lifecycle original quick and form actions in desktop and mobile Chrome
        run: node tests/lifecycle-browser-smoke.js
      - name: Check customer return receiving Service in desktop and mobile Chrome
        run: node tests/customer-return-browser-smoke.js
      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Emulator Admin SDK grouped reservation integration
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-yushin "node --test tests/emulator-grouped-reservation.cjs tests/emulator-order-reservation.cjs"
      - name: Install Functions runtime for real callable emulator
        run: npm install --prefix functions --no-save --no-package-lock
      - name: Preview Callable Auth + Functions + Firestore Emulator integration
        env:
          ENABLE_GROUPED_RESERVATION: "true"
          ENABLE_SERVICE_CASE_EMULATOR: "true"
          ENABLE_QUICK_PURCHASE_EMULATOR: "true"
        run: npx --yes firebase-tools@15 emulators:exec --only firestore,auth,functions --project demo-yushin "node --test --test-concurrency=1 tests/emulator-grouped-reservation-callable.cjs tests/emulator-service-case-callable.cjs tests/emulator-quick-purchase-callable.cjs"
      - name: Explicit same-warehouse reservation Callable in isolated Auth Emulator
        env:
          ENABLE_GROUPED_RESERVATION: "true"
          ENABLE_GROUPED_RESERVATION_SAME_WAREHOUSE: "true"
        run: npx --yes firebase-tools@15 emulators:exec --only firestore,auth,functions --project demo-yushin "node --test --test-name-pattern='explicitly enabled same-warehouse Callable' tests/emulator-grouped-reservation-callable.cjs"
      - name: Explicit whole-order reservation Callable in isolated Auth Emulator
        env:
          ENABLE_ORDER_RESERVATION_BACKEND: "true"
        run: npx --yes firebase-tools@15 emulators:exec --only firestore,auth,functions --project demo-yushin "node --test --test-name-pattern='explicitly enabled whole-order Callable' tests/emulator-grouped-reservation-callable.cjs"
      - name: Verify v2 Auth Callables and real browser lifecycle handoff in isolated demo Emulator
        run: node tools/run-v2-return-auth-emulator.cjs
      - name: Verify single-item and whole-order dual-warehouse atomic reservation in Emulator
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-yushin "node --test tests/emulator-single-item-location.cjs tests/emulator-order-location.cjs"
      - name: Verify shipment, delivery correction and physical return receipt in Emulator
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-yushin "node --test tests/emulator-location-shipment.cjs"
      - name: Compile and test Firestore rules
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-yushin "node --max-old-space-size=4096 --test tests/firestore-rules.test.js"
